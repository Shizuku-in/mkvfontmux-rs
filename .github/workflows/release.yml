name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.6

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build CLI
        run: cargo build --release --locked -p mfm-cli
      - name: Build GUI
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive target/release/mkvfontmux.exe, LICENSE, README.md -DestinationPath "dist/mkvfontmux-cli-$v-windows-x64.zip"
          Copy-Item LICENSE app/build/windows/x64/runner/Release/
          Compress-Archive app/build/windows/x64/runner/Release/* -DestinationPath "dist/MkvFontMux-$v-windows-x64.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          v="${{ github.ref_name }}"
          mkdir dist
          zip -j "dist/mkvfontmux-cli-$v-macos-arm64.zip" target/release/mkvfontmux LICENSE README.md
          ditto -c -k --keepParent app/build/macos/Build/Products/Release/MkvFontMux.app "dist/MkvFontMux-$v-macos-arm64.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ github.ref_name }}"
          mkdir dist
          tar -czf "dist/mkvfontmux-cli-$v-linux-x64.tar.gz" -C target/release mkvfontmux -C "$PWD" LICENSE README.md
          cp LICENSE app/build/linux/x64/release/bundle/
          tar -czf "dist/MkvFontMux-$v-linux-x64.tar.gz" -C app/build/linux/x64/release bundle --transform 's/^bundle/MkvFontMux/'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
